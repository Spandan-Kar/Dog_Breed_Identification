<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dog Breed Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Base & Background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: url('https://www.transparenttextures.com/patterns/skulls.png'), linear-gradient(135deg, #1e3c72, #2a5298);
      background-blend-mode: overlay;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-box {
      width: 95%;
      max-width: 1500px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
      padding: 40px;
      display: flex;
      justify-content: space-between;
      gap: 30px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .left-panel, .right-panel {
      flex: 1;
      padding: 30px;
    }

    h1 {
      font-size: 60px;
      font-weight: 700;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 50px;
      transition: all 0.3s ease;
    }

    h1:hover {
      transform: scale(1.05);
      text-shadow: 0 0 10px #fff;
    }

    input[type="file"] {
      padding: 18px;
      background: #fff;
      border-radius: 15px;
      border: none;
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 18px;
      font-size: 20px;
      background: linear-gradient(to right, #f12711, #f5af19);
      color: white;
      border: none;
      border-radius: 15px;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #f5af19, #f12711);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
    }

    .error {
      margin-top: 20px;
      background: rgba(255, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
      font-weight: 600;
      color: #ffdada;
    }

    .image-preview img {
      width: 100%;
      height: auto;
      max-height: 450px;
      border-radius: 20px;
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.6);
      transition: 0.3s ease;
    }

    .image-preview img:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .result-text {
      margin-top: 40px;
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(to right, #ffd700, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      transition: 0.3s ease;
    }

    .result-text:hover {
      transform: scale(1.03);
      filter: brightness(120%);
    }

    .confidence {
      font-size: 24px;
      color: #e0e0e0;
      margin-top: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    @media screen and (max-width: 768px) {
      .main-box {
        flex-direction: column;
      }

      h1 {
        font-size: 40px;
      }

      .result-text {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
<div class="main-box">
  <!-- LEFT -->
  <div class="left-panel">
    <h1>🐾 Dog Breed Classifier</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit">Upload & Predict</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>

  <!-- RIGHT -->
  <div class="right-panel text-center">
    {% if uploaded_image %}
      <div class="image-preview mb-4">
        <img src="{{ url_for('static', filename='uploads/' + uploaded_image) }}" alt="Dog Image">
      </div>
    {% endif %}

    {% if prediction %}
      <div class="result-text">Breed: {{ prediction.breed }}</div>
      <div class="confidence">Confidence: {{ prediction.confidence }}%</div>
    {% endif %}
  </div>
</div>
</body>
</html>
